<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Love Heart ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060208;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    .replay-btn {
      position: fixed;
      bottom: 24px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      color: #ffb8c6;
      background: rgba(255, 75, 110, 0.15);
      border: 1px solid rgba(255, 100, 130, 0.35);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(255, 30, 70, 0.2);
    }

    .replay-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .replay-btn:hover {
      background: rgba(255, 75, 110, 0.3);
      border-color: rgba(255, 130, 160, 0.6);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 30, 70, 0.35);
    }

    .replay-btn:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <canvas id="heartCanvas"></canvas>
  <button id="replayBtn" class="replay-btn">Putar Ulang ❤️</button>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const replayBtn = document.getElementById('replayBtn');

    const SC = 21;
    const OY = 20;
    const DURATION = 10;
    const ANIM_FRAMES = 42;
    const LIFT = 34;
    const GAP = 7;
    const SIZES = [9, 10, 11, 12];
    const FONT_FAMILY = 'Arial, sans-serif';
    const BG_HEX = '#060208';
    const BGC = [6 / 255, 2 / 255, 8 / 255];
    const FLASH = [1.0, 0.78, 0.78];
    const WINE = [0.58, 0.0, 0.09];
    const CRIMSON = [0.90, 0.05, 0.14];
    const BLOOD = [0.98, 0.10, 0.16];

    const PHRASES = [
      "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
      "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
      "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
      "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
      "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
    ];

    function createRng(seed = 11) {
      let s = seed;
      return function () {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
    }

    function uniform(rng, min, max) {
      return min + (max - min) * rng();
    }

    function choice(rng, arr) {
      return arr[Math.floor(rng() * arr.length)];
    }

    function shuffle(rng, arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function heartMath(a) {
      const sinA = Math.sin(a);
      const x = 16 * Math.pow(sinA, 3);
      const y = (
        13 * Math.cos(a)
        - 5 * Math.cos(2 * a)
        - 2 * Math.cos(3 * a)
        - Math.cos(4 * a)
      );
      return { x: x * SC, y: y * SC + OY };
    }

    function mix(a, b, k) {
      return a.map((val, i) => val + (b[i] - val) * k);
    }

    function dim(c, k) {
      return c.map(v => v * k);
    }

    function clamp(v, min = 0, max = 1) {
      return Math.max(min, Math.min(max, v));
    }

    function rgbToHex(c) {
      const r = Math.round(clamp(c[0]) * 255);
      const g = Math.round(clamp(c[1]) * 255);
      const b = Math.round(clamp(c[2]) * 255);
      return `rgb(${r}, ${g}, ${b})`;
    }

    const POLY = [];
    for (let i = 0; i < 720; i++) {
      POLY.push(heartMath(2 * Math.PI * i / 720));
    }
    const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
    const YMAX = Math.max(...POLY.map(p => p.y));
    const YMIN = Math.min(...POLY.map(p => p.y));
    const CY = (YMAX + YMIN) / 2;

    function spans(y) {
      const xs = [];
      for (const [p1, p2] of EDGES) {
        if ((p1.y <= y && y < p2.y) || (p2.y <= y && y < p1.y)) {
          xs.push(p1.x + (y - p1.y) * (p2.x - p1.x) / (p2.y - p1.y));
        }
      }
      xs.sort((a, b) => a - b);
      const res = [];
      for (let i = 0; i < xs.length; i += 2) {
        if (i + 1 < xs.length) res.push([xs[i], xs[i + 1]]);
      }
      return res;
    }

    function intersect(A, B) {
      const out = [];
      for (const a of A) {
        for (const b of B) {
          const lo = Math.max(a[0], b[0]);
          const hi = Math.min(a[1], b[1]);
          if (hi - lo > 14) {
            out.push([lo, hi]);
          }
        }
      }
      return out;
    }

    function* phraseCycle(rng) {
      while (true) {
        const order = shuffle(rng, PHRASES);
        for (const p of order) yield p;
      }
    }

    function mathDist(x, y) {
      return Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
    }

    function measureTextWidth(text, size) {
      ctx.font = `bold ${size}px ${FONT_FAMILY}`;
      return ctx.measureText(text).width;
    }

    function buildHeartLayout(rng) {
      const cycle = phraseCycle(rng);
      const rowHeight = 16;
      const half = rowHeight / 2;
      const placed = [];

      let y = YMAX - half;
      while (y > YMIN + half) {
        const row = intersect(spans(y + half), spans(y - half));

        for (let [lo, hi] of row) {
          lo += 4;
          hi -= 4;
          let cur = lo + uniform(rng, 0, 8);
          const line = [];

          while (true) {
            let fit = null;
            for (let attempt = 0; attempt < 10; attempt++) {
              const text = cycle.next().value;
              const size = choice(rng, SIZES);
              const w = measureTextWidth(text, size);
              if (cur + w <= hi) {
                fit = { text, size, w };
                break;
              }
            }
            if (!fit) break;
            line.push([cur + fit.w / 2, fit.text, fit.size, fit.w]);
            cur += fit.w + GAP;
          }

          if (line.length === 0) continue;

          if (line.length > 1) {
            const left = hi - (line[line.length - 1][0] + line[line.length - 1][3] / 2);
            for (let i = 0; i < line.length; i++) {
              line[i][0] += left * i / (line.length - 1);
            }
          } else {
            line[0][0] = (lo + hi) / 2;
          }

          for (let i = 0; i < line.length; i++) {
            const edge = (i === 0 || i === line.length - 1);
            placed.push({
              x: line[i][0],
              y: y,
              text: line[i][1],
              size: line[i][2],
              w: line[i][3],
              edge: edge
            });
          }
        }
        y -= rowHeight;
      }

      for (const p of placed) {
        const rad = Math.min(1.0, mathDist(p.x, p.y));
        let base = mix(WINE, CRIMSON, 0.25 + 0.75 * rad);
        base = mix(base, BLOOD, uniform(rng, 0, 0.35) + (p.edge ? 0.3 : 0));
        p.color = base.map(v => Math.min(1.0, v));
        p.rad = rad;
      }

      const edges = placed.filter(p => p.edge);
      const inner = placed.filter(p => !p.edge);
      edges.sort((a, b) => ((Math.atan2(a.x, a.y - CY) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) - (((Math.atan2(b.x, b.y - CY) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)));
      inner.sort((a, b) => (-a.rad + uniform(rng, 0, 0.08)) - (-b.rad + uniform(rng, 0, 0.08)));

      return edges.concat(inner);
    }


    let ORDER = [];
    let placedItems = [];
    let activeItems = [];
    let spawnIndex = 0;
    let spawnAcc = 0;
    let isSpawning = true;
    let rate = 0;
    let shimmerList = [];
    let scale = 1;
    let dpr = 1;
    let heartCenterX = 0;
    let heartCenterY = 0;
    let animationFrameId = null;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      const targetDim = 720;
      scale = Math.min((width * 0.95) / targetDim, (height * 0.9) / targetDim);
      if (scale > 1.1) scale = 1.1;

      heartCenterX = (width / 2);
      heartCenterY = (height / 2) + (OY * scale);
    }

    function initAnimation() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      replayBtn.classList.remove('visible');

      const rng = createRng(11);
      ORDER = buildHeartLayout(rng);
      rate = ORDER.length / (DURATION * 60);
      spawnIndex = 0;
      spawnAcc = 0;
      isSpawning = true;
      placedItems = [];
      activeItems = [];
      shimmerList = [];

      lastTime = performance.now();
      requestAnimationFrame(renderLoop);
    }

    function spawnItem(p) {
      const rngLocal = Math.random;
      const item = {
        ...p,
        f: 0,
        dx: (rngLocal() - 0.5) * 20,
        mainColor: p.color,
        currentColor: p.color,
        currentX: p.x,
        currentY: -p.y,
        currentAlpha: 0,
        done: false,
        shimmerEnd: 0
      };
      activeItems.push(item);
      placedItems.push(item);
    }

    let lastTime = 0;

    function renderLoop(currentTime) {
      const dt = Math.min(currentTime - lastTime, 34);
      lastTime = currentTime;


      if (isSpawning) {
        spawnAcc += rate * (dt / 16.666);
        while (spawnAcc >= 1 && spawnIndex < ORDER.length) {
          spawnAcc -= 1;
          spawnItem(ORDER[spawnIndex++]);
        }
        if (spawnIndex >= ORDER.length) {
          isSpawning = false;
        }
      }

      for (let i = activeItems.length - 1; i >= 0; i--) {
        const p = activeItems[i];
        p.f += (dt / 16.666);
        const u = clamp(p.f / ANIM_FRAMES);
        const e = 1 - Math.pow(1 - u, 3);
        const hover = (1 - e) * LIFT;

        p.currentX = p.x + p.dx * (1 - e);
        p.currentY = -p.y - hover;

        const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
        const blended = mix(mix(BGC, p.color, Math.pow(e, 1.5)), FLASH, flash);
        p.currentColor = blended;
        p.e = e;

        if (u >= 1) {
          p.currentX = p.x;
          p.currentY = -p.y;
          p.currentColor = p.color;
          p.done = true;
          shimmerList.push(p);
          activeItems.splice(i, 1);
        }
      }


      if (!isSpawning && activeItems.length === 0) {
        replayBtn.classList.add('visible');
        if (shimmerList.length > 0 && Math.random() < 0.12) {
          const target = choice(Math.random, shimmerList);
          target.shimmerEnd = currentTime + 320;
        }
      }

      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.fillStyle = BG_HEX;
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (const p of placedItems) {
        const scrX = heartCenterX + p.currentX * scale;
        const scrY = heartCenterY + p.currentY * scale;
        const fontSize = Math.max(7, p.size * scale);
        ctx.font = `bold ${fontSize}px ${FONT_FAMILY}`;

        if (!p.done) {
          const haloCol = mix(BGC, dim(p.color, 0.20), (p.e || 1) * (p.e || 1));
          ctx.fillStyle = rgbToHex(haloCol);
          ctx.fillText(p.text, scrX, scrY);
        }


        if (p.shimmerEnd && currentTime < p.shimmerEnd) {
          const remain = (p.shimmerEnd - currentTime) / 320;
          const shimFlash = Math.sin(remain * Math.PI) * 0.75;
          ctx.fillStyle = rgbToHex(mix(p.color, FLASH, shimFlash));
        } else {
          ctx.fillStyle = rgbToHex(p.currentColor);
        }

        ctx.fillText(p.text, scrX, scrY);
      }

      ctx.restore();
      animationFrameId = requestAnimationFrame(renderLoop);
    }

    window.addEventListener('resize', () => {
      resize();
    });

    replayBtn.addEventListener('click', () => {
      initAnimation();
    });

    resize();
    initAnimation();
  </script>
</body>

</html>
